apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spark-jobs
  namespace: argocd
spec:
  project: data-engineering
  source:
    repoURL: https://github.com/GDG-on-Campus-KHU/25-26-k8s-study-Data-InfraStructure.git
    path: data-infrastructure/spark/overlays/production
    targetRevision: master
  destination:
    server: https://kubernetes.default.svc
    namespace: spark-jobs
  syncPolicy:
    automated:
      prune: false  # Spark Job 결과 보존
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
