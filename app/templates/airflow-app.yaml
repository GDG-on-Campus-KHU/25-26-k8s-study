apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: data-engineering

  source:
    repoURL: https://airflow.apache.org/
    chart: airflow
    targetRevision: 1.7.0
    helm:
      values: |
        webserver:
          service:
            type: LoadBalancer
        workers:
          replicas: 3
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2"
        postgresql:
          enabled: true
          auth:
            username: airflow
            database: airflow
        redis:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: airflow

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
